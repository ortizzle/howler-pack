<style>
/* Gold of Luna — ivory parchment, wine crimson, restrained gold (from the original Howlers) */
:root {

}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }

  color: var(--ink); font-family: var(--fb); font-size: 16px; line-height: 1.5; min-height: 100vh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) calc(140px + env(safe-area-inset-bottom)) env(safe-area-inset-left); }

.wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

// ───────────────────────── Sync: private Gist, fetch-merge-write, newest updatedAt wins, tombstones purged after 60 days
const Sync = {
  filename: 'howler-pack.json',
  state: 'off', lastAt: 0, timer: null, busy: false, again: false,
  id() { return Store.get('gist_id', ''); },
  token() { return Store.get('gist_token', ''); },
  on() { return !PREVIEW && !!(this.id() && this.token()); },
  headers() { return { Authorization: 'Bearer ' + this.token(), Accept: 'application/vnd.github+json' }; },
  async pullRemote() {
    const res = await fetch('https://api.github.com/gists/' + this.id(), { headers: this.headers(), cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP_' + res.status);
    const gist = await res.json(), file = gist.files && gist.files[this.filename];
    if (!file) return { records: {} };
    const text = file.truncated ? await (await fetch(file.raw_url, { cache: 'no-store' })).text() : file.content;
    const parsed = JSON.parse(text || '{"records":{}}');
    return parsed && parsed.records ? parsed : { records: {} };
  },
  merge(local, remote) {
    const out = { records: Object.assign({}, remote.records) };
    for (const id in (local.records || {})) { const a = local.records[id], b = out.records[id]; if (!b || (a.updatedAt || 0) > (b.updatedAt || 0)) out.records[id] = a; }
    const cutoff = Date.now() - 60 * 86400000;

    return out;
  },
  soon() { if (!this.on()) return; clearTimeout(this.timer); this.timer = setTimeout(() => this.save(), 1500); this.set('pending'); },
  set(st) { this.state = st; const dot = document.getElementById('sync-dot'); if (dot) { dot.className = 'sync-dot ' + st; dot.title = { ok: 'Synced', pending: 'Saving…', error: 'Sync problem: tap to retry', off: 'Not syncing (this phone only)', busy: 'Syncing…' }[st] || ''; } },
  async save() {
    if (!this.on()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.set('busy');
    try {
      let merged = DB;
      try { merged = this.merge(DB, await this.pullRemote()); } catch (e) { if (/HTTP_40[13]/.test(e.message)) throw e; }
      const res = await fetch('https://api.github.com/gists/' + this.id(), { method: 'PATCH', cache: 'no-store',
        headers: Object.assign({ 'Content-Type': 'application/json' }, this.headers()),
        body: JSON.stringify({ files: { [this.filename]: { content: JSON.stringify(merged) } } }) });
      if (!res.ok) throw new Error('HTTP_' + res.status);
      // keep anything typed while we were saving
      DB = this.merge(DB, merged); Store.set('data', DB); _ver++;
      this.lastAt = Date.now(); this.set('ok');
    } catch (e) { this.set('error'); syncError(e); }
    finally { this.busy = false; if (this.again) { this.again = false; this.save(); } }
  },
  async pull() {
    if (!this.on() || this.busy) return false;
    this.busy = true; this.set('busy');
    try {
      const before = JSON.stringify(DB.records).length;
      DB = this.merge(DB, await this.pullRemote()); Store.set('data', DB); _ver++;
      this.lastAt = Date.now(); this.set('ok');
      return JSON.stringify(DB.records).length !== before;
    } catch (e) { this.set('error'); syncError(e); return false; }
    finally { this.busy = false; }
  },
  async create(token) {
    const res = await fetch('https://api.github.com/gists', { method: 'POST', cache: 'no-store',
      headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ description: 'Howler Pack family data (private)', public: false, files: { [this.filename]: { content: JSON.stringify(DB) } } }) });
    if (!res.ok) throw new Error('HTTP_' + res.status);
    return (await res.json()).id;
  },
};

async function enableNotifications() {
